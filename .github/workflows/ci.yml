name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  ai-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ci/check-skill-sync.cjs
      - run: node ci/check-spec-refs.cjs
      - run: node ci/check-require-decls.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python ci/check-knowledge-facts.py
      # 项目自有验证（按需启用）
      # - run: npm ci
      # - run: npm run check

  commit-gate:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ci/check-commit-msg.cjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
